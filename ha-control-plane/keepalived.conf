# ==============================================================================
# CONFIG: keepalived.conf
# DESC: Demonio VRRP para gestión de IP Virtual (VIP). Si HAProxy cae en el
#       nodo actual, la VIP migra automáticamente a un Master de backup.
# ==============================================================================

vrrp_script check_haproxy {
    script "killall -0 haproxy"
    interval 2
    weight 20
}

vrrp_instance VI_1 {
    state MASTER
    interface wan
    virtual_router_id 51
    priority 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass <VRRP_AUTH_PASSWORD>
    }
    virtual_ipaddress {
        10.110.19.10/16
    }
    track_script {
        check_haproxy
    }
}